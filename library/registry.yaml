  description: Heavy flanged and spiked aged-gold mace head on an iron shaft with a leather grip, mounted on the rig's mace bone.
  aliases: [mace, gada, club, war club]
  builder: integrations/blender/build_showcase_scene.py:build_asura (mace parts)
  provenance: M2-B / M3-A / Showcase v1; raw LTX breaks it in the fastest strike frames (M2-B, 768, M3-A, Showcase run 1)
  limitations: [one size; must be held by a rig with a mace bone]
  data:
    parts:
      - {oc_id: sc_mace_head, pass_index: 8, part: head}
      - {oc_id: sc_mace_shaft, pass_index: 9, part: shaft}
    track_part: sc_mace_head
    weapon_class: heavy_blunt
    mount: {type: rig_bone, rig: m2b_humanoid_16bone, bone: mace}
    prompt: and holds a heavy golden spiked mace

- id: trident_v1
