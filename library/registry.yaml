# --- actions ------------------------------------------------------------------------------------------------------
- id: mace_slam_v1
  kind: action
  description: One heavy mace slam - guard, overhead wind-up, apex, accelerating downswing, ground contact beside the target, hold, recovery.
  aliases: [slam, slams, strike, strikes, smash, smashes, attack, attacks, attacking, swing, swings, hit, hits, bash]
  builder: integrations/blender/build_temple_strike_scene.py:choreography_frames + key_poses (two-bone IK -> FK keys)
  provenance: M2-B (apex/contact 0/0 frames off, articulation followed); M3-A and Showcase v1 (same keys, exact timeline)
  limitations:
    - one authored strike; root and legs fixed (no travel); the head lands on the ground beside the target (no body contact)
    - 49-frame / 24 fps profile only
  params:
    strike_frames: {type: integer, default: 6, min: 2, max: 9, description: apex -> contact duration (9 = M2-B retry speed)}
  data:
    actor_motion: rigged
    roles: [attacker]
    instance_id: strike
    requires_rig: m2b_humanoid_16bone
    requires_weapon_class: heavy_blunt
    frames: 49
    fps: 24
    timeline_version: {default: 1.0.0, other: "1.0.0-strike{strike_frames}f"}
    events:
      START: {frame: 0}
      GUARD_END: {frame: 7}
      APEX: {frame: 23}
      CONTACT: {frame: 23, plus_param: strike_frames}
      HOLD_END: {frame: 34}
      RECOVERY_START: {frame: 34}
      END: {frame: 48}
    phases:
      - {id: guard, kind: idle, start: START, end: GUARD_END}
      - {id: windup, kind: other, start: GUARD_END, end: APEX}
      - {id: strike, kind: strike, start: APEX, end: CONTACT}
      - {id: impact, kind: impact, start: CONTACT, end: HOLD_END}
      - {id: recovery, kind: recovery, start: HOLD_END, end: END}
    peak_weapon_speed_head_widths_per_frame: {showcase_768x448: 1.27, m2b_512x320: 1.25}
    default_vfx: [impact_dust_v1, debris_v1, sparks_v1, floor_cracks_v1, impact_flash_v1, camera_jolt_v1]

- id: mace_strike_blocked_v1
  kind: action
  status: experimental
  description: >-
    The mace slam's guard, wind-up and apex, then an overhead downswing stopped on the defender's raised trident
    (weapon-on-weapon contact), a one-frame bind, a rebound and a re-chamber. Chosen as the partner of a parry.
  aliases: []
  builder: >-
    build_showcase_scene.py:blocked_keys + solve_blocked_pose (the contact pose is solved against the defender's block
    so the mace head touches the shaft on CONTACT by construction)
  provenance: D3 (pending)
  limitations:
    - only as the partner of trident_parry_v1 by ascetic_defender_v2; root and legs fixed
    - 49-frame / 24 fps profile only
  params:
    strike_frames: {type: integer, default: 6, min: 2, max: 9, description: apex -> contact duration}
  data:
    actor_motion: rigged
    roles: [attacker]
    instance_id: strike
    requires_rig: m2b_humanoid_16bone
    requires_weapon_class: heavy_blunt
    frames: 49
    fps: 24
    timeline_version: {default: 1.0.0, other: "1.0.0-strike{strike_frames}f"}
    events:
      START: {frame: 0}
      GUARD_END: {frame: 7}
      APEX: {frame: 23}
      CONTACT: {frame: 23, plus_param: strike_frames}
      HOLD_END: {frame: 34}
      RECOVERY_START: {frame: 34}
      END: {frame: 48}
    phases:
      - {id: guard, kind: idle, start: START, end: GUARD_END}
      - {id: windup, kind: other, start: GUARD_END, end: APEX}
      - {id: strike, kind: strike, start: APEX, end: CONTACT}
      - {id: rebound, kind: recoil, start: CONTACT, end: HOLD_END}
      - {id: recovery, kind: recovery, start: HOLD_END, end: END}
    contact: {id: mace_on_trident, event: CONTACT, partner_action: trident_parry_v1, own_part: mace,
              partner_part: trident, contact_point: mace.head, bind_frames: 3}
    qc_profile: showcase_class_contact_v2   # D3(b): QC aligned with ownership (LTX: actors; Blender: weapon geometry)
    peak_weapon_speed_head_widths_per_frame: {showcase_768x448: 1.51}   # D3 build: 103.7 px/frame into contact, head 68.7 px
    default_vfx: [sparks_v1, clash_flash_v1]

- id: defender_guard_v1
  kind: action
  description: Static defensive guard held for the whole shot (trident forward toward the attacker).
  aliases: [guard, guards, guarding, defend, defends, brace, braces, stands]
  builder: static pose of ascetic_defender_v1 (no keys); ascetic_defender_v2 holds the same guard (one key)
  provenance: Showcase v1
  limitations: [no motion and no weapon contact (D3 moved the block / parry words to trident_parry_v1)]
  data:
    actor_motion: static
    roles: [defender]
    instance_id: guard
    frames: 49
    fps: 24
    events: {START: {frame: 0}, END: {frame: 48}}
    phases:
      - {id: defender_hold, kind: defense, start: START, end: END}
    prompt: in a guarding stance

- id: trident_parry_v1
  kind: action
  status: experimental
  description: >-
    A reactive parry: from the forward guard the defender pulls the trident up and back as the wind-up begins, brings
    it over into a hanging guard (hands high, shaft slanting down toward the attacker) two frames before the blow,
    takes the mace on the shaft at CONTACT, holds the bind for a frame, drives the shaft up and settles in a high guard.
  aliases: [block, blocks, blocking, blocked, parry, parries, parrying, parried, deflect, deflects, deflecting]
  builder: build_showcase_scene.py:defender_parry_poses + key_defender (interpolated targets keyed on every frame)
  provenance: D3 (pending)
  limitations:
    - only with ascetic_defender_v2 against mace_strike_blocked_v1; root and legs fixed (no footwork)
    - one block line (hanging guard); the contact point on the shaft is fixed (1.10 m from the rear hand)
  params:
    strike_frames: {type: integer, default: 6, min: 2, max: 9, description: synchronised to the attacker's strike}
  data:
    actor_motion: rigged
    roles: [defender]
    instance_id: parry
    requires_rig: m2b_humanoid_16bone_ascetic
    requires_weapon_class: polearm
    partner_action: mace_strike_blocked_v1
    sync_params: [strike_frames]
    arrive_before_contact: 2      # the block is in place 2 frames before CONTACT (engine PARRY_ARRIVE_BEFORE)
    frames: 49
    fps: 24
    events:
      START: {frame: 0}
      GUARD_END: {frame: 8}
      CONTACT: {frame: 23, plus_param: strike_frames}
      HOLD_END: {frame: 34}
      END: {frame: 48}
    phases:
      - {id: def_guard, kind: idle, start: START, end: GUARD_END}
      - {id: def_raise, kind: defense, start: GUARD_END, end: CONTACT}
      - {id: def_block, kind: contact, start: CONTACT, end: HOLD_END}
      - {id: def_recovery, kind: recovery, start: HOLD_END, end: END}
    prompt: in a guarding stance

# --- camera -------------------------------------------------------------------------------------------------------
- id: orbit_push_v1
  kind: camera
  description: Look-at orbit plus push-in around a target, fixed lens, no roll (the M2-C / M3-A / Showcase family).
  aliases: [orbit, orbiting, push-in, push in, pushes in, dolly in, circling]
  builder: build_temple_camera_scene.camera_samples -> CameraTrajectory -> CameraMotion -> oc_import_camera
  provenance: M2-C PASS (24 deg orbit + 1.5 m push-in, 35 mm); M3-A (24 deg, 1.4 m); Showcase v1 (low variant)
  limitations: [the generated move reaches ~0.9x of the authored displacement (M2-C, one run)]
  data:
    family: orbit_push_look_at
    defaults:
      azimuth_deg: [-14.0, 10.0]
      radius_m: [7.6, 6.3]
      height_m: [2.25, 1.95]
      lens_mm: 32.0
      ease_linear_mix: 0.5
      yaw_offset_deg: 0.0
      sensor_mm: 36.0
      sensor_fit: AUTO
      clip_start: 0.1
      clip_end: 300.0
    default_target: {anchor_role: attacker, offset: [1.3, 0.1, 1.5]}
    variants:
      low: {}
      high: {azimuth_deg: [-12.0, 12.0], radius_m: [8.4, 7.0], height_m: [3.6, 3.3], lens_mm: 35.0}
    variant_aliases: {low: [low, low angle, low cinematic, heroic], high: [high, high angle, raised, elevated]}
    envelope:
      max_orbit_deg: 24.0
      max_push_in_m: 1.5
      height_m: [1.9, 3.6]
      lens_mm: [32.0, 35.0]
      min_radius_m: 6.0
      ease_linear_mix: [0.3, 1.0]

# --- effects (all triggered by semantic events) ---------------------------------------------------------------------
- id: impact_dust_v1
  kind: vfx
  description: Backlit dust volumes - a plume and a ground ring - expanding and thinning after the contact.
  aliases: [dust, dust cloud, dust burst]
  builder: build_showcase_scene.build_impact_fx (plume + ring volumes) -> impact_fx layer
  provenance: Showcase v1 (revised twice after viewing)
  limitations: [rendered in the shared impact_fx layer]
  data: {component: dust, layer: impact_fx, trigger_event: CONTACT, duration: to_end}
- id: debris_v1
  kind: vfx
  description: Angular stone chips on ballistic arcs that come to rest on the floor.
  aliases: [debris, chips, stones, rubble, fragments]
  builder: build_showcase_scene.build_impact_fx (chips) -> impact_fx layer
  provenance: M3-A, Showcase v1
  data: {component: debris, layer: impact_fx, trigger_event: CONTACT, duration: to_end}
- id: sparks_v1
  kind: vfx
  description: Short emissive spark streaks for five frames after the contact.
  aliases: [sparks, spark]
  builder: build_showcase_scene.build_impact_fx (sparks) -> impact_fx layer
  provenance: Showcase v1
  data: {component: sparks, layer: impact_fx, trigger_event: CONTACT, duration: to_end}
- id: floor_cracks_v1
  kind: vfx
  description: Floor crack and crater decal that appears at the contact and persists.
  aliases: [cracks, crack, cracked floor, crater]
  builder: build_showcase_scene.build_impact_fx (crack decal) -> impact_fx layer
  provenance: Showcase v1
  data: {component: cracks, layer: impact_fx, trigger_event: CONTACT, duration: to_end}
- id: impact_flash_v1
  kind: vfx
  description: Impact light flash - a light-only pass of a decaying point light, added to the frame.
  aliases: [flash, impact flash, light burst]
  builder: build_showcase_scene.build_impact_fx (fx_flash) -> impact_flash light pass (blend add)
  provenance: Showcase v1 (energy cut to ~45% after viewing)
  data: {component: flash, layer: impact_flash, trigger_event: CONTACT, duration: 5,
         energy_w: [2200.0, 1100.0, 420.0, 140.0, 40.0]}
- id: clash_flash_v1
  kind: vfx
  status: experimental
  description: Weapon-clash light flash - the impact_flash light pass at the 3D contact point, at about a quarter of its energy.
  aliases: []
  builder: build_showcase_scene.build_impact_fx (fx_flash at the parry contact point) -> impact_flash light pass (blend add)
  provenance: >-
    D3: the Showcase flash (0.4 m above the floor) blew out the defender even at ~45%; the clash flash sits ~1.6 m
    up between both actors, so it starts lower (to be confirmed on the reference render)
  data: {component: flash, layer: impact_flash, trigger_event: CONTACT, duration: 5,
         energy_w: [600.0, 300.0, 120.0, 40.0, 12.0]}
- id: camera_jolt_v1
  kind: vfx
  description: 2-px post-only camera-response jolt over three frames (never alters the authored camera).
  aliases: [jolt, shake, camera shake, camera jolt]
  builder: tools/admission/finish_grade.py (shake)
  provenance: Showcase v1
  data: {component: jolt, layer: grade, trigger_event: CONTACT, offsets_px: [[0, 0, 2], [1, -1, -1], [2, 1, 0]]}

