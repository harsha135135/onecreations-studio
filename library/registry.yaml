- id: fast_weapon_v2
  kind: protection_rule
  description: Blender owns the weapon in every frame (90 deg shutter, holdout occlusion, gain grade, soften) with geometric swept-band ghost repair and a temporal fill in the authored fast frames.
  aliases: []
  builder: render_layers.py + tools/admission/hybrid_composite.py (CompositeManifest protected_geometry layer)
  provenance: >-
    M2-B (raw smear in the fastest frames, >= ~0.7 head widths/frame at 512x320 - a local working observation, not a
    model limit); 768 comparison (no improvement); M3-A (v1 not usable, v2 post-hoc); Showcase v1 (swept_band + temporal)
  limitations: [colour-independent but needs the authored silhouette; fills around a moving actor are excluded]
  data:
    applies_to_weapon_class: [heavy_blunt]
    trigger: {min_peak_speed_head_widths_per_frame: 0.7}
    layer_settings:
      render: {holdout_others: true, motion_blur_shutter: 0.25, samples: 128}
      grade: per_channel_gain
      ghost_suppression: true
      ghost_mode: swept_band
      ghost_fill: temporal
      ghost_band_px: 8
      soften_px: 0.7
      authored_speed_widths: 0.5
      dilate_frames: 1
      all_frames: true

- id: contact_weapon_v1
  kind: protection_rule
  status: experimental
  description: >-
    A weapon that takes part in an authored weapon-on-weapon contact is owned by Blender in every frame (the
    fast_weapon_v2 layer treatment), so the weapons in the final meet exactly where they were authored to.
  aliases: []
  builder: render_layers.py + tools/admission/hybrid_composite.py (CompositeManifest protected_geometry layer)
  provenance: >-
    D3 rule P6: thin weapons double or smear in raw LTX (M2-A: a small trident came back doubled); a parry only reads
    if both weapons meet where they were authored to. All frames rather than a contact window, so the weapon never
    switches source mid-shot (the mace's proven treatment)
  limitations: [as fast_weapon_v2; the trident is long but only ~6-8 px wide at 768x448]
  data:
    applies_to_weapon_class: [polearm, heavy_blunt]
    trigger: {in_contact: true}
    layer_settings:
      render: {holdout_others: true, motion_blur_shutter: 0.25, samples: 128}
      grade: per_channel_gain
      ghost_suppression: true
      ghost_mode: swept_band
      ghost_fill: temporal
      ghost_band_px: 8
      ghost_frames: all            # a long thin weapon is never 'fast' in its own widths: suppress raw doubles everywhere
      soften_px: 0.7
      authored_speed_widths: 0.5
      dilate_frames: 1
      all_frames: true
